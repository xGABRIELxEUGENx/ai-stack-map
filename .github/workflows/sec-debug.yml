name: SEC debug (temporar)

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Tickeri separați prin spațiu'
        default: 'XOM OKLO IREN'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance lxml
      - name: Seriile SEC pe fiecare tag
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          python - <<'EOF'
          import os, datetime as dt, update_stack_map as u
          since = dt.date.today() - dt.timedelta(days=550)
          for t in os.environ["TICKERS"].split():
              cik = u._sec_cik(t)
              g = u._sec_get(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json").get("facts", {}).get("us-gaap", {})
              print(f"\n===== {t} CIK {cik}")
              for tag in u.SEC_REV_TAGS + u.SEC_NI_TAGS + [u.SEC_NI_FALLBACK]:
                  facts = [x for x in g.get(tag, {}).get("units", {}).get("USD", []) if x.get("end", "") >= "2025-06-01"]
                  if not facts:
                      print(f"-- {tag}: —"); continue
                  print(f"-- {tag}: serie {sorted((e.isoformat(), v / 1e6) for e, v in u._sec_series(g, tag).items() if e > since)}")
                  for x in sorted(facts, key=lambda x: (x["end"], x.get("start", ""), x.get("filed", ""))):
                      print(f"   {x.get('start')} {x['end']} {x['val'] / 1e6:.2f} {x.get('form')} {x.get('filed')}")
              print("REZULTAT sec_quarters:", u.sec_quarters(t))
          EOF
