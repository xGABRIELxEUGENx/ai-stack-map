name: DIAG SEC (temporar)
on:
  workflow_dispatch:
  push:
    branches: [sec-anomalii]
    paths: ['diag/sec_docs.py']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - run: python diag/sec_docs.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - run: |
          git config user.name  "stack-map-bot"
          git config user.email "stack-map-bot@users.noreply.github.com"
          git add diag/docs
          git commit -m "DIAG: documente oficiale (temporar)"
          git push
