name: Update AI Stack Map

on:
  schedule:
    - cron: '30 21 * * 1-5'   # luni–vineri, 21:30 UTC = după închiderea bursei US (vara 17:30 ET, iarna 16:30 ET)
  workflow_dispatch:           # buton „Run workflow” pentru rulare manuală

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance lxml
      - run: python update_stack_map.py
      - name: Salvează versiunea nouă
        run: |
          git config user.name  "stack-map-bot"
          git config user.email "stack-map-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nicio schimbare."; exit 0; fi
          v=$(ls ai-stack-map-mobile-*.html | sed 's/[^0-9]//g' | sort -n | tail -1)
          git commit -m "Update zilnic $(date -u +%Y-%m-%d) — v$v"
          git push
