name: Cross-check AI Stack Map (metoda B)

on:
  schedule:
    - cron: '10 6 * * 1,3,5'   # luni, miercuri, vineri 06:10 UTC — înainte de analiza Claude de la 09:54 ora României
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python crosscheck.py          # doar biblioteca standard Python + node; nu folosește yfinance/Yahoo
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # opțional: „Nume email@domeniu” pentru SEC EDGAR
      - name: Salvează raportul
        run: |
          git config user.name  "stack-map-bot"
          git config user.email "stack-map-bot@users.noreply.github.com"
          git add crosscheck-report.md crosscheck-history.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cross-check metoda B $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push
