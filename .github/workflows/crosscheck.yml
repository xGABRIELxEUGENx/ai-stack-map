name: Cross-check AI Stack Map (metoda B)

on:
  workflow_run:                # pornește după fiecare update reușit (update.yml, luni–vineri 21:30 UTC), deci după închiderea bursei
    workflows: ['Update AI Stack Map']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crosscheck:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install yfinance lxml
      - run: python crosscheck.py          # Python + node; Yahoo doar ca control pentru venituri/profit (pagina le are din SEC + comunicate)
      - name: Salvează raportul
        run: |
          git config user.name  "stack-map-bot"
          git config user.email "stack-map-bot@users.noreply.github.com"
          git add crosscheck-report.md crosscheck-history.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cross-check metoda B $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push
