<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test simboluri TradingView v1</title>
<style>
  body { background:#050810; color:#d8e4f0; font-family:ui-monospace,Menlo,Consolas,monospace; margin:0; padding:16px; }
  h1 { font-size:1rem; margin:0 0 4px; } p { color:#7a90aa; font-size:0.78rem; margin:0 0 14px; line-height:1.5; }
  .row { border:1px solid #1a2840; border-radius:8px; padding:8px 10px; margin-bottom:10px; background:#070b16; }
  .sym { font-weight:bold; font-size:0.85rem; margin-bottom:4px; } .sym small { color:#7a90aa; font-weight:normal; }
  .lbl { color:#4a5e7a; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.08em; margin:6px 0 2px; }
  .w { min-height:46px; }
</style>
</head>
<body>
<h1>Test simboluri TradingView (widget gratuit)</h1>
<p>Fiecare simbol e încărcat singur, în aceleași două widget-uri ca în pagină: banda (ticker-tape) și rândul (single-quote). Cercul roșu „!” = simbolul nu merge în widget. Primele două rânduri sunt de control (merg în pagină).</p>
<div id="out"></div>
<script>
const SYMS = [
  ['OANDA:NAS100USD', 'control, merge'],
  ['BITSTAMP:BTCUSD', 'control, merge'],
  ['TVC:DXY', 'în pagină acum'],
  ['TVC:VIX', 'în pagină acum'],
  ['TVC:TNX', 'în pagină din v46 (US10Y)'],
  ['TVC:US10Y', 'în pagină până la v45'],
  ['CAPITALCOM:DXY', 'alternativă DXY'],
  ['CBOE:VIX', 'alternativă VIX']
];
function embed(box, widget, cfg) {
  box.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
  box.className = 'w tradingview-widget-container';
  const sc = document.createElement('script');
  sc.async = true; sc.src = 'https://s3.tradingview.com/external-embedding/embed-widget-' + widget + '.js';
  sc.innerHTML = JSON.stringify(cfg); box.appendChild(sc);
}
const out = document.getElementById('out');
for (const [s, note] of SYMS) {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = '<div class="sym">' + s + ' <small>— ' + note + '</small></div><div class="lbl">bandă (ticker-tape)</div><div class="w t"></div><div class="lbl">rând (single-quote)</div><div class="w q"></div>';
  out.appendChild(r);
  embed(r.querySelector('.t'), 'ticker-tape', { symbols: [{ proName: s, title: s.split(':')[1] }], showSymbolLogo: false, isTransparent: true, displayMode: 'compact', colorTheme: 'dark', locale: 'en' });
  embed(r.querySelector('.q'), 'single-quote', { symbol: s, width: '100%', isTransparent: true, colorTheme: 'dark', locale: 'en' });
}
</script>
</body>
</html>
